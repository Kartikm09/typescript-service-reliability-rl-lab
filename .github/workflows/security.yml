name: Security
on:
  push:
  pull_request:
  schedule: [{ cron: "31 4 * * 1" }]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: "24.18.0", cache: npm }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: python scripts/secret_scan.py
      - run: npm audit --audit-level=high
      - name: Scan complete Git history with Gitleaks 8.24.3
        run: |
          archive=gitleaks_8.24.3_linux_x64.tar.gz
          curl --fail --silent --show-error --location --remote-name \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/${archive}"
          curl --fail --silent --show-error --location --remote-name \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_checksums.txt"
          grep " ${archive}$" gitleaks_8.24.3_checksums.txt | sha256sum --check
          tar -xzf "${archive}" gitleaks
          ./gitleaks detect --source . --redact --verbose
