[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polyglot-rl-evaluator"
version = "0.1.0"
description = "Deterministic local evaluator for synthetic coding-agent tasks"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Kartik BK Mishra" }]
dependencies = []

[project.scripts]
rl-evaluate = "rl_evaluator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
